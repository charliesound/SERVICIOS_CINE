name: Windows CID native runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'scripts/local_media_agent/**'
      - 'scripts/ci/validate_windows_cid.py'
      - 'tests/unit/test_cid_local_media_agent_native_windows_runtime.py'
      - '.github/workflows/windows-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'scripts/local_media_agent/**'
      - 'scripts/ci/validate_windows_cid.py'
      - 'tests/unit/test_cid_local_media_agent_native_windows_runtime.py'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Show Python version
        shell: cmd
        run: python --version

      - name: Install pytest for CI
        shell: cmd
        run: python -m pip install "pytest>=8.2,<9"

      - name: Install package
        shell: cmd
        run: python -m pip install .

      - name: Run native Windows contract tests
        shell: cmd
        run: python -m pytest tests/unit/test_cid_local_media_agent_native_windows_runtime.py -q

      - name: Validate installed CID entrypoint
        shell: cmd
        run: python scripts/ci/validate_windows_cid.py
